[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-switchboard"
version = "0.0.4"
description = "Standalone browser voice runtime for text agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.11.0",
  "httpx>=0.28.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
stt-faster-whisper = [
  "faster-whisper>=1.1.0",
]
stt-whisper = [
  "openai-whisper>=20240930",
]
tts-edge = [
  "edge-tts>=6.1.0",
]
tts-piper = [
  "piper-tts>=1.4.1",
  "pathvalidate>=3.2.0",
]
tts-chatterbox = [
  "chatterbox-tts>=0.1.7",
  "torch==2.6.0; python_version < '3.14'",
  "torchaudio==2.6.0; python_version < '3.14'",
  "torch==2.11.0; python_version >= '3.14'",
  "torchaudio==2.11.0; python_version >= '3.14'",
]

[project.scripts]
agent-switchboard = "agent_switchboard.app:main"
agent-switchboard-calibrate = "agent_switchboard.calibrate_commands:main"
agent-switchboard-speak = "agent_switchboard.speak_paragraphs:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_switchboard"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_switchboard/static" = "agent_switchboard/static"

[tool.hatch.build.targets.sdist]
include = [
  "/src/agent_switchboard/**/*.py",
  "/src/agent_switchboard/static/**/*",
  "/tests/**/*",
  "/README.md",
  "/pyproject.toml",
  "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
