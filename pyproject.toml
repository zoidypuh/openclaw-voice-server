[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-switchboard"
version = "0.1"
description = "Standalone browser voice runtime for text agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.11.0",
  "httpx>=0.28.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
stt-faster-whisper = [
  "faster-whisper>=1.1.0",
]
stt-whisper = [
  "openai-whisper>=20240930",
]
tts-edge = [
  "edge-tts>=6.1.0",
]

[project.scripts]
agentic-switchboard = "agentic_switchboard.app:main"
agentic-switchboard-calibrate = "agentic_switchboard.calibrate_commands:main"
agentic-switchboard-speak = "agentic_switchboard.speak_paragraphs:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_switchboard"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentic_switchboard/static" = "agentic_switchboard/static"
"media/ascii-art.txt" = "agentic_switchboard/static/media/ascii-art.txt"

[tool.hatch.build.targets.sdist]
include = [
  "/src/agentic_switchboard/**/*.py",
  "/src/agentic_switchboard/static/**/*",
  "/media/ascii-art.txt",
  "/tests/**/*",
  "/README.md",
  "/pyproject.toml",
  "/.env.example",
]

[tool.hatch.build.targets.sdist.force-include]
"media/ascii-art.txt" = "media/ascii-art.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
