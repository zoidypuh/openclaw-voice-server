<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --text: #c7c7c7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    display: grid;
    place-items: center;
  }
  #version {
    position: fixed;
    top: 16px;
    right: 18px;
    color: #808080;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }
  #version .alpha {
    color: #f0c44e;
  }
  #setup-link {
    position: fixed;
    top: 16px;
    left: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.34rem 0.72rem;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    color: #a8a8a8;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  #setup-link:hover {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.2);
    color: #d8d8d8;
  }
  body[data-shell="tauri"] #setup-link {
    top: 14px;
    left: 14px;
  }
  body[data-shell="tauri"] #setup-link:hover {
    color: #ececec;
  }
  main {
    width: min(72vw, 360px);
    display: grid;
    gap: 18px;
    justify-items: center;
  }
  #top-bar {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  #utility-bar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
  }
  .control-btn {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #d5d5d5;
    border-radius: 999px;
    padding: 0.78rem 1rem;
    font: inherit;
    letter-spacing: 0.04em;
    text-transform: lowercase;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease;
  }
  .control-btn:hover:enabled {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.22);
  }
  .control-btn:disabled {
    opacity: 0.42;
    cursor: default;
  }
  .control-btn.active {
    background: rgba(109,226,255,0.14);
    border-color: rgba(109,226,255,0.35);
    color: #bfefff;
  }
  .mini-btn {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    color: #a8a8a8;
    border-radius: 999px;
    padding: 0.34rem 0.72rem;
    font: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .mini-btn:hover {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.2);
    color: #d8d8d8;
  }
  .mini-btn.active {
    color: #86c8ff;
    border-color: rgba(134,200,255,0.3);
    background: rgba(134,200,255,0.08);
  }
  #pause-btn {
    min-width: 7.2rem;
    padding: 0.58rem 1.12rem;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
  }
  #mute-btn {
    min-width: 5.2rem;
  }
  body[data-state="paused"] #crab {
    opacity: 0.72;
    filter: saturate(0.85);
  }
  #status {
    width: 100%;
    text-align: center;
    font-size: 1.35rem;
    line-height: 1.2;
    color: #b7b7b7;
    min-height: 1.3em;
    text-transform: lowercase;
  }
  #status-hint {
    width: 100%;
    min-height: 1.1em;
    margin-top: -0.5rem;
    text-align: center;
    color: #7f7f7f;
    font-size: 0.73rem;
    letter-spacing: 0.04em;
  }
  #level-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  #level {
    flex: 1 1 auto;
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
  }
  #level-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff735c, #6de2ff);
    transition: width 50ms linear;
  }
  #level-value {
    flex: 0 0 4.25rem;
    text-align: right;
    color: #8e8e8e;
    font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    transition: color 180ms ease;
  }
  #level-value.peak-held {
    color: #ffb067;
  }
  #thinking-timer {
    width: 100%;
    min-height: 1.1em;
    text-align: center;
    color: #8e8e8e;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  .popup-panel {
    width: 100%;
    display: grid;
    gap: 10px;
    padding: 0.85rem 0.95rem;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    background: rgba(255,255,255,0.035);
    position: relative;
  }
  .panel-title {
    color: #cfcfcf;
    font-size: 0.88rem;
    line-height: 1.2;
  }
  .panel-button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .tuning-row {
    display: grid;
    gap: 0.38rem;
  }
  .tuning-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.8rem;
    color: #cfcfcf;
    font-size: 0.88rem;
    line-height: 1.2;
  }
  .tuning-value {
    color: #86c8ff;
    font-variant-numeric: tabular-nums;
  }
  .tuning-hint {
    color: #8a8a8a;
    font-size: 0.74rem;
    line-height: 1.25;
  }
  .tuning-slider {
    width: 100%;
    margin: 0;
    accent-color: #86c8ff;
  }
  .hidden {
    display: none !important;
  }
  #crab {
    width: 100%;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
<a id="setup-link" href="./setup">setup</a>
<div id="version">v0.04 <span class="alpha">ALPHA</span></div>
<main>
  <div id="top-bar">
    <button id="pause-btn" class="control-btn" type="button">pause</button>
  </div>
  <div id="status">listening</div>
  <div id="status-hint"></div>
  <div id="utility-bar">
    <button id="interrupt-btn" class="mini-btn" type="button">interrupt</button>
    <button id="mute-btn" class="mini-btn" type="button">mute</button>
    <button id="sliders-toggle" class="mini-btn active" type="button">threshold</button>
  </div>
  <div id="level-row">
    <div id="level" aria-hidden="true"><div id="level-bar"></div></div>
    <div id="level-value" aria-live="off">-60 dB</div>
  </div>
  <section id="interrupt-panel" class="popup-panel hidden" aria-label="interrupt mode">
    <div class="panel-title">interrupt mode</div>
    <div class="panel-button-row">
      <button id="interrupt-mode-off" class="mini-btn" type="button">off</button>
      <button id="interrupt-mode-barge" class="mini-btn" type="button">barge-in</button>
      <button id="interrupt-mode-keyword" class="mini-btn" type="button">keyword</button>
    </div>
    <div class="tuning-hint">`off` disables voice interruption while reply audio is playing. `barge-in` lets you cut in naturally. `keyword` only interrupts on `halt`.</div>
  </section>
  <section id="tuning-panel" class="popup-panel" aria-label="voice tuning">
    <label class="tuning-row" for="wait-after-speak">
      <span class="tuning-label">
        <span>wait after speak</span>
        <span id="wait-after-speak-value" class="tuning-value"></span>
      </span>
      <input id="wait-after-speak" class="tuning-slider" type="range" min="250" max="4000" step="50">
    </label>
    <label class="tuning-row" for="turn-end-threshold">
      <span class="tuning-label">
        <span>voice input threshold</span>
        <span id="turn-end-threshold-value" class="tuning-value"></span>
      </span>
      <input id="turn-end-threshold" class="tuning-slider" type="range" min="-60" max="0" step="1">
    </label>
  </section>
  <div id="thinking-timer" class="hidden"></div>
  <img id="crab" src="" alt="">
</main>

<script>
function resolveAppBase() {
  return new URL('.', window.location.href);
}

const APP_BASE = resolveAppBase();
const appUrl = (path) => new URL(path, APP_BASE).toString();
const SHELL_STATUS_ID = new URLSearchParams(window.location.search).get('shell_id') || '';
const CRAB_IMAGES = {
  listening: [appUrl('static/media/listening_transparent.png')],
  paused: [appUrl('static/media/listening_transparent.png')],
  thinking: [appUrl('static/media/thinking_transparent.png')],
  interrupting: [appUrl('static/media/thinking_transparent.png')],
  reconnecting: [appUrl('static/media/listening_transparent.png')],
  speaking: [appUrl('static/media/speaking1_transparent.png'), appUrl('static/media/speaking2_transparent.png')],
};

function isTauriShell() {
  return (navigator.userAgent || '').includes('Tauri');
}

function configureSetupLink() {
  const setupLink = document.getElementById('setup-link');
  if (!setupLink || !isTauriShell()) {
    return;
  }
  document.body.dataset.shell = 'tauri';
  setupLink.href = appUrl('setup');
  setupLink.target = '_blank';
  setupLink.rel = 'noopener noreferrer';
  setupLink.textContent = 'browser settings';
  setupLink.title = 'open setup in your browser';
}

let ws = null;
let audioCtx = null;
let stream = null;
let processor = null;
let analyser = null;
let playbackAudio = null;
let audioChunks = [];
let silenceStart = null;
let speechStart = null;
let hasSpeech = false;
let busy = false;
let pendingIdle = false;
let paused = true;
let muted = false;
let interruptPending = false;
let currentState = 'paused';
let replyActive = false;
let speakingTimer = null;
let speakingFrame = 0;
let audioQueue = [];
let currentAudio = null;
let currentAudioUrl = null;
let currentLevelWidth = 0;
let currentLevelDb = -60;
let heldPeakLevelDb = -60;
let heldPeakUntil = 0;
let thinkingStartedAt = null;
let transientStatusTimer = null;
let shellStatusTimer = null;
let lastPublishedShellState = '';
let interruptCooldownUntil = 0;
let speechGateHoldUntil = 0;
let interruptProbeChunks = [];
let interruptProbeSpeechMs = 0;
let interruptProbeSilenceMs = 0;
let interruptProbePending = false;
let bargeInChunks = [];
let bargeInSpeechMs = 0;
let bargeInSilenceMs = 0;
let bargeInProbePending = false;
let bargeInPending = false;
let playbackSoftPaused = false;
let playbackSessionStarted = false;
let bargeInGraceUntil = 0;
let pendingBargeInAudio = null;
let pendingBargeInPrefixText = '';
let holdContinuationActive = false;
let heldTurnPrefixText = '';
let manualFinishProbePending = false;
let manualFinishProbeCooldownUntil = 0;
let runtimeStatePromise = null;
let playbackUnlocked = false;
let pendingServerSpeakRequestId = '';
let pendingAudioMimeType = 'audio/mpeg';
let lastAudioProcessAt = 0;
let audioRecoveryPromise = null;
let captureWatchdogTimer = null;
let audioRecoveryHooksBound = false;
let windowsClientShortcuts = {
  pause_resume: '',
  interrupt: '',
};
let settings = {
  silence_ms: 1700,
  silence_threshold: 0.015,
  min_speech_ms: 500,
};

const TUNING_STORAGE_KEY = 'openclaw.voice.tuning.v1';
const TUNING_PANEL_STORAGE_KEY = 'openclaw.voice.tuning-panel.v1';
const INTERRUPT_MODE_STORAGE_KEY = 'openclaw.voice.interrupt-mode.v1';
const INTERRUPT_PANEL_STORAGE_KEY = 'openclaw.voice.interrupt-panel.v1';
const DEFAULT_TUNING = {
  inputThresholdDb: -41,
  waitAfterSpeakMs: 1700,
};
const TURN_COMMIT_MIN_SPEECH_MS = 650;
const LEVEL_DB_FLOOR = -60;
const LEVEL_DB_CEILING = 0;
const LEVEL_PEAK_HOLD_MS = 5000;
const WAIT_AFTER_SPEAK_MIN_MS = 250;
const WAIT_AFTER_SPEAK_MAX_MS = 4000;
const TARGET_CAPTURE_SAMPLE_RATE = 16000;
const SPEECH_ZCR_MIN = 0.008;
const SPEECH_ZCR_MAX = 0.24;
const SPEECH_CREST_MAX = 8.0;
const INTERRUPT_RMS_MIN = 0.0045;
const INTERRUPT_ZCR_MIN = 0.003;
const INTERRUPT_ZCR_MAX = 0.34;
const INTERRUPT_CREST_MAX = 14.0;
const SPEECH_GATE_HOLD_MS = 220;
const INTERRUPT_PROBE_MIN_SPEECH_MS = 220;
const INTERRUPT_PROBE_SILENCE_MS = 220;
const INTERRUPT_PROBE_MAX_MS = 1200;
const INTERRUPT_COOLDOWN_MS = 300;
const PAUSED_COMMAND_MIN_SPEECH_MS = 220;
const PAUSED_COMMAND_MAX_MS = 1200;
const PLAYBACK_NO_BARGE_IN_MS = 800;
const BARGE_IN_MIN_SPEECH_MS = 450;
const BARGE_IN_SILENCE_MS = 220;
const BARGE_IN_MAX_MS = 1600;
const APPLE_PLAYBACK_NO_BARGE_IN_MS = 1800;
const APPLE_BARGE_IN_MIN_SPEECH_MS = 220;
const APPLE_BARGE_IN_SILENCE_MS = 220;
const APPLE_BARGE_IN_MAX_MS = 1200;
const MANUAL_FINISH_PROBE_MIN_SILENCE_MS = 260;
const MANUAL_FINISH_PROBE_COOLDOWN_MS = 900;
const AUDIO_CAPTURE_STALL_MS = 2600;
const AUDIO_WATCHDOG_INTERVAL_MS = 1000;
let tuning = { ...DEFAULT_TUNING };
let tuningPanelVisible = true;
let interruptPanelVisible = false;
let tuningStorageState = {
  inputThresholdDb: false,
  waitAfterSpeakMs: false,
};
const manualFinishEnabled = true;
let interruptMode = 'barge-in';

function amplitudeToDb(amplitude) {
  return 20 * Math.log10(Math.max(Number(amplitude) || 0, 0.000001));
}

function legacyLevelToDb(level) {
  const normalized = clampNumber(level, 0, 100, 0);
  if (normalized <= 0) {
    return LEVEL_DB_FLOOR;
  }
  return clampNumber(
    amplitudeToDb(normalized / 1180),
    LEVEL_DB_FLOOR,
    LEVEL_DB_CEILING,
    DEFAULT_TUNING.inputThresholdDb,
  );
}

function gainMultiplierToDb(multiplier) {
  return 20 * Math.log10(Math.max(Number(multiplier) || 0, 0.000001));
}

function resampleFloatBuffer(buffer, inputSampleRate, outputSampleRate) {
  const sourceRate = Math.max(Number(inputSampleRate) || 0, 1);
  const targetRate = Math.max(Number(outputSampleRate) || 0, 1);
  if (!buffer.length || sourceRate === targetRate) {
    return buffer;
  }
  if (targetRate < sourceRate) {
    const sampleRateRatio = sourceRate / targetRate;
    const newLength = Math.max(1, Math.round(buffer.length / sampleRateRatio));
    const result = new Float32Array(newLength);
    let offsetResult = 0;
    let offsetBuffer = 0;
    while (offsetResult < result.length) {
      const nextOffsetBuffer = Math.round((offsetResult + 1) * sampleRateRatio);
      let accum = 0;
      let count = 0;
      for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i += 1) {
        accum += buffer[i];
        count += 1;
      }
      result[offsetResult] = count ? accum / count : 0;
      offsetResult += 1;
      offsetBuffer = nextOffsetBuffer;
    }
    return result;
  }
  const sampleRateRatio = sourceRate / targetRate;
  const newLength = Math.max(1, Math.round(buffer.length / sampleRateRatio));
  const result = new Float32Array(newLength);
  for (let i = 0; i < result.length; i += 1) {
    const sourceIndex = i * sampleRateRatio;
    const lowerIndex = Math.floor(sourceIndex);
    const upperIndex = Math.min(lowerIndex + 1, buffer.length - 1);
    const mix = sourceIndex - lowerIndex;
    const lowerSample = buffer[lowerIndex] ?? 0;
    const upperSample = buffer[upperIndex] ?? lowerSample;
    result[i] = lowerSample + ((upperSample - lowerSample) * mix);
  }
  return result;
}

function floatTo16BitPCM(floatBuffer) {
  const pcm = new Int16Array(floatBuffer.length);
  for (let i = 0; i < floatBuffer.length; i += 1) {
    const sample = Math.max(-1, Math.min(1, floatBuffer[i]));
    pcm[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
  }
  return pcm;
}

function inputBufferToPcm16(inputBuffer, inputSampleRate) {
  const resampledInput = resampleFloatBuffer(
    new Float32Array(inputBuffer),
    inputSampleRate,
    TARGET_CAPTURE_SAMPLE_RATE,
  );
  return floatTo16BitPCM(resampledInput);
}

function dbToMeterWidth(levelDb) {
  const clamped = clampNumber(levelDb, LEVEL_DB_FLOOR, LEVEL_DB_CEILING, LEVEL_DB_FLOOR);
  return ((clamped - LEVEL_DB_FLOOR) / (LEVEL_DB_CEILING - LEVEL_DB_FLOOR)) * 100;
}

function refreshLevelValue(now = performance.now()) {
  const levelValue = document.getElementById('level-value');
  const showPeak = (
    currentState === 'listening'
    && heldPeakUntil > now
    && heldPeakLevelDb > currentLevelDb + 0.4
  );
  levelValue.textContent = formatDb(showPeak ? heldPeakLevelDb : currentLevelDb);
  levelValue.classList.toggle('peak-held', showPeak);
}

function resetLevelPeakHold() {
  heldPeakLevelDb = currentLevelDb;
  heldPeakUntil = 0;
  refreshLevelValue();
}

function setLevelDb(levelDb, { updatePeak = true } = {}) {
  currentLevelDb = clampNumber(levelDb, LEVEL_DB_FLOOR, LEVEL_DB_CEILING, LEVEL_DB_FLOOR);
  currentLevelWidth = dbToMeterWidth(currentLevelDb);
  document.getElementById('level-bar').style.width = `${currentLevelWidth}%`;
  const now = performance.now();
  if (updatePeak && currentState === 'listening') {
    if (heldPeakUntil <= now) {
      heldPeakLevelDb = currentLevelDb;
      heldPeakUntil = now + LEVEL_PEAK_HOLD_MS;
    } else if (currentLevelDb > heldPeakLevelDb + 0.1) {
      heldPeakLevelDb = currentLevelDb;
    }
  }
  refreshLevelValue(now);
}

function setStatusText(text) {
  document.getElementById('status').textContent = text;
}

function sendPlaybackAcceptance(requestId) {
  if (!requestId || !ws || ws.readyState !== WebSocket.OPEN) {
    return;
  }
  ws.send(JSON.stringify({ type: 'playback-accepted', request_id: requestId }));
}

function sendPlaybackRejection(requestId, error) {
  if (!requestId || !ws || ws.readyState !== WebSocket.OPEN) {
    return;
  }
  ws.send(JSON.stringify({
    type: 'playback-rejected',
    request_id: requestId,
    error: String(error || 'The voice client could not accept playback.'),
  }));
}

function sendTranscriptPrefix(prefixText) {
  if (!prefixText || !ws || ws.readyState !== WebSocket.OPEN) {
    return;
  }
  ws.send(JSON.stringify({ type: 'set-transcript-prefix', prefix_text: prefixText }));
}

function clampNumber(value, min, max, fallback) {
  const parsed = Number(value);
  if (!Number.isFinite(parsed)) {
    return fallback;
  }
  return Math.min(max, Math.max(min, parsed));
}

function loadTuning() {
  try {
    const raw = localStorage.getItem(TUNING_STORAGE_KEY);
    if (!raw) {
      return;
    }
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === 'object') {
      if (typeof parsed.inputThresholdDb !== 'undefined') {
        tuning.inputThresholdDb = clampNumber(
          parsed.inputThresholdDb,
          LEVEL_DB_FLOOR,
          LEVEL_DB_CEILING,
          DEFAULT_TUNING.inputThresholdDb,
        );
        tuningStorageState.inputThresholdDb = true;
      } else if (typeof parsed.endOfTurnBarThreshold !== 'undefined') {
        tuning.inputThresholdDb = legacyLevelToDb(parsed.endOfTurnBarThreshold);
        tuningStorageState.inputThresholdDb = true;
      }
      if (typeof parsed.waitAfterSpeakMs !== 'undefined') {
        tuning.waitAfterSpeakMs = clampNumber(
          parsed.waitAfterSpeakMs,
          WAIT_AFTER_SPEAK_MIN_MS,
          WAIT_AFTER_SPEAK_MAX_MS,
          DEFAULT_TUNING.waitAfterSpeakMs,
        );
        tuningStorageState.waitAfterSpeakMs = true;
      }
    }
  } catch (_) {}
}

function saveTuning() {
  localStorage.setItem(TUNING_STORAGE_KEY, JSON.stringify(tuning));
}

function loadTuningPanelVisibility() {
  try {
    const raw = localStorage.getItem(TUNING_PANEL_STORAGE_KEY);
    if (raw === 'hidden') {
      tuningPanelVisible = false;
    }
  } catch (_) {}
}

function saveTuningPanelVisibility() {
  localStorage.setItem(TUNING_PANEL_STORAGE_KEY, tuningPanelVisible ? 'visible' : 'hidden');
}

function defaultInterruptMode() {
  return isAppleVoiceClient() ? 'keyword' : 'barge-in';
}

function normalizeInterruptMode(mode) {
  if (mode === 'off') {
    return 'off';
  }
  return mode === 'keyword' ? 'keyword' : 'barge-in';
}

function loadInterruptMode() {
  try {
    const raw = localStorage.getItem(INTERRUPT_MODE_STORAGE_KEY);
    if (raw) {
      interruptMode = normalizeInterruptMode(raw);
      return;
    }
  } catch (_) {}
  interruptMode = defaultInterruptMode();
}

function saveInterruptMode() {
  localStorage.setItem(INTERRUPT_MODE_STORAGE_KEY, interruptMode);
}

function loadInterruptPanelVisibility() {
  try {
    const raw = localStorage.getItem(INTERRUPT_PANEL_STORAGE_KEY);
    if (raw === 'visible') {
      interruptPanelVisible = true;
    }
  } catch (_) {}
}

function saveInterruptPanelVisibility() {
  localStorage.setItem(INTERRUPT_PANEL_STORAGE_KEY, interruptPanelVisible ? 'visible' : 'hidden');
}

function formatDb(levelDb) {
  return `${Math.round(levelDb)} dB`;
}

function formatWaitAfterSpeak(ms) {
  if (ms >= 1000) {
    const value = ms % 1000 === 0 ? (ms / 1000).toFixed(1) : (ms / 1000).toFixed(2);
    return `${value}s`;
  }
  return `${Math.round(ms)} ms`;
}

function resolveWaitAfterSpeakMs() {
  return clampNumber(
    tuning.waitAfterSpeakMs,
    WAIT_AFTER_SPEAK_MIN_MS,
    WAIT_AFTER_SPEAK_MAX_MS,
    DEFAULT_TUNING.waitAfterSpeakMs,
  );
}

function usesKeywordInterruptOnly() {
  return interruptMode === 'keyword';
}

function voiceInterruptDisabled() {
  return interruptMode === 'off';
}

function normalizeTranscriptPrefix(text) {
  return String(text || '').trim().replace(/\s+/g, ' ');
}

function applyRuntimeShortcuts(windowsClientSettings) {
  const shortcuts = windowsClientSettings?.shortcuts || {};
  windowsClientShortcuts = {
    pause_resume: String(shortcuts.pause_resume || ''),
    interrupt: String(shortcuts.interrupt || ''),
  };
  updateStatusHint();
}

function formatShortcutHint() {
  const parts = [];
  if (windowsClientShortcuts.pause_resume) {
    parts.push(`pause ${windowsClientShortcuts.pause_resume}`);
  }
  if (windowsClientShortcuts.interrupt) {
    parts.push(`interrupt ${windowsClientShortcuts.interrupt}`);
  }
  return parts.join(' · ');
}

function updateStatusHint() {
  const hint = document.getElementById('status-hint');
  const text = currentState === 'listening' ? formatShortcutHint() : '';
  hint.textContent = text;
  hint.classList.toggle('hidden', !text);
}

function combineTranscriptPrefix(prefixText, suffixText) {
  const prefix = normalizeTranscriptPrefix(prefixText);
  const suffix = normalizeTranscriptPrefix(suffixText);
  if (!prefix) {
    return suffix;
  }
  if (!suffix) {
    return prefix;
  }
  return `${prefix} ${suffix}`;
}

function clearHeldTurnState() {
  holdContinuationActive = false;
  heldTurnPrefixText = '';
}

function armHeldTurn(prefixText) {
  holdContinuationActive = true;
  heldTurnPrefixText = combineTranscriptPrefix(heldTurnPrefixText, prefixText);
  pendingIdle = false;
  resetCaptureBuffer();
  resetInterruptSpeechDetection();
  resetInterruptProbeCapture();
  resetBargeInCapture();
  if (!paused && !interruptPending) {
    setState('listening');
  }
}

function isHeldTurnActive() {
  return holdContinuationActive;
}

function queuePendingTurn(audioBuffer, { prefixText = '' } = {}) {
  pendingBargeInAudio = audioBuffer;
  pendingBargeInPrefixText = normalizeTranscriptPrefix(prefixText);
  clearHeldTurnState();
  requestInterrupt({ keepPaused: false, preservePendingInput: true });
}

function sendBufferedTurn(audioBuffer, { prefixText = '' } = {}) {
  if (!audioBuffer || !ws || ws.readyState !== WebSocket.OPEN) {
    return false;
  }
  const normalizedPrefix = normalizeTranscriptPrefix(prefixText);
  if (
    interruptPending
    || busy
    || replyActive
    || currentAudio
    || audioQueue.length > 0
    || currentState === 'speaking'
  ) {
    queuePendingTurn(audioBuffer, { prefixText: normalizedPrefix });
    return true;
  }
  if (normalizedPrefix) {
    sendTranscriptPrefix(normalizedPrefix);
  }
  busy = true;
  pendingIdle = false;
  setState('thinking');
  ws.send(audioBuffer);
  clearHeldTurnState();
  return true;
}

function applyRuntimeAudioSettings(audioSettings) {
  settings = { ...settings, ...(audioSettings || {}) };
  if (!tuningStorageState.waitAfterSpeakMs) {
    tuning.waitAfterSpeakMs = clampNumber(
      settings.silence_ms,
      WAIT_AFTER_SPEAK_MIN_MS,
      WAIT_AFTER_SPEAK_MAX_MS,
      DEFAULT_TUNING.waitAfterSpeakMs,
    );
  }
  if (!tuningStorageState.inputThresholdDb && Number(settings.silence_threshold) > 0) {
    tuning.inputThresholdDb = clampNumber(
      amplitudeToDb(settings.silence_threshold),
      LEVEL_DB_FLOOR,
      LEVEL_DB_CEILING,
      DEFAULT_TUNING.inputThresholdDb,
    );
  }
  renderTuningControls();
}

function renderInterruptControls() {
  const interruptBtn = document.getElementById('interrupt-btn');
  const interruptPanel = document.getElementById('interrupt-panel');
  interruptBtn.classList.toggle('active', interruptPanelVisible);
  interruptPanel.classList.toggle('hidden', !interruptPanelVisible);
  document.getElementById('interrupt-mode-off').classList.toggle('active', interruptMode === 'off');
  document.getElementById('interrupt-mode-barge').classList.toggle('active', interruptMode === 'barge-in');
  document.getElementById('interrupt-mode-keyword').classList.toggle('active', interruptMode === 'keyword');
}

function renderTuningControls() {
  const waitAfterSpeakSlider = document.getElementById('wait-after-speak');
  const turnEndSlider = document.getElementById('turn-end-threshold');
  waitAfterSpeakSlider.value = String(resolveWaitAfterSpeakMs());
  turnEndSlider.value = String(tuning.inputThresholdDb);
  document.getElementById('wait-after-speak-value').textContent = formatWaitAfterSpeak(resolveWaitAfterSpeakMs());
  document.getElementById('turn-end-threshold-value').textContent = formatDb(tuning.inputThresholdDb);
  document.getElementById('tuning-panel').classList.toggle('hidden', !tuningPanelVisible);
  document.getElementById('sliders-toggle').classList.toggle('active', tuningPanelVisible);
}

function configureTuningControls() {
  loadTuning();
  loadTuningPanelVisibility();
  loadInterruptMode();
  loadInterruptPanelVisibility();
  renderInterruptControls();
  renderTuningControls();

  document.getElementById('wait-after-speak').addEventListener('input', (event) => {
    tuning.waitAfterSpeakMs = clampNumber(
      event.target.value,
      WAIT_AFTER_SPEAK_MIN_MS,
      WAIT_AFTER_SPEAK_MAX_MS,
      DEFAULT_TUNING.waitAfterSpeakMs,
    );
    renderTuningControls();
    saveTuning();
  });

  document.getElementById('turn-end-threshold').addEventListener('input', (event) => {
    tuning.inputThresholdDb = clampNumber(
      event.target.value,
      LEVEL_DB_FLOOR,
      LEVEL_DB_CEILING,
      DEFAULT_TUNING.inputThresholdDb,
    );
    resetInterruptSpeechDetection();
    resetInterruptProbeCapture();
    renderTuningControls();
    saveTuning();
  });

  document.getElementById('sliders-toggle').addEventListener('click', () => {
    tuningPanelVisible = !tuningPanelVisible;
    if (tuningPanelVisible) {
      interruptPanelVisible = false;
      saveInterruptPanelVisibility();
      renderInterruptControls();
    }
    renderTuningControls();
    saveTuningPanelVisibility();
  });

  document.getElementById('interrupt-btn').addEventListener('click', () => {
    interruptPanelVisible = !interruptPanelVisible;
    if (interruptPanelVisible) {
      tuningPanelVisible = false;
      saveTuningPanelVisibility();
      renderTuningControls();
    }
    renderInterruptControls();
    saveInterruptPanelVisibility();
  });

  document.getElementById('interrupt-mode-barge').addEventListener('click', () => {
    setInterruptMode('barge-in');
  });

  document.getElementById('interrupt-mode-keyword').addEventListener('click', () => {
    setInterruptMode('keyword');
  });

  document.getElementById('interrupt-mode-off').addEventListener('click', () => {
    setInterruptMode('off');
  });
}

function scheduleListeningStatusRestore() {
  if (transientStatusTimer) {
    clearTimeout(transientStatusTimer);
  }
  transientStatusTimer = setTimeout(() => {
    transientStatusTimer = null;
    if (!busy && currentState === 'listening') {
      setStatusText('listening');
    }
  }, 4000);
}

function updateControlStates() {
  const pauseBtn = document.getElementById('pause-btn');
  const muteBtn = document.getElementById('mute-btn');
  pauseBtn.textContent = paused ? 'resume' : 'pause';
  pauseBtn.classList.toggle('active', paused);
  muteBtn.textContent = muted ? 'unmute' : 'mute';
  muteBtn.classList.toggle('active', muted);
  renderInterruptControls();
}

function applyMicMuteState() {
  if (!stream) {
    return;
  }
  for (const track of stream.getAudioTracks()) {
    track.enabled = !muted;
  }
}

function commitBufferedTurnNow() {
  if (
    !hasSpeech
    || audioChunks.length === 0
    || !ws
    || ws.readyState !== WebSocket.OPEN
    || (busy && !isHeldTurnActive())
    || paused
    || (!isHeldTurnActive() && (currentAudio || audioQueue.length > 0 || currentState === 'speaking'))
  ) {
    return false;
  }
  sendBufferedTurn(flattenAudio(audioChunks), { prefixText: heldTurnPrefixText });
  resetCaptureBuffer();
  return true;
}

function setMutedState(nextMuted) {
  muted = Boolean(nextMuted);
  applyMicMuteState();
  if (!commitBufferedTurnNow()) {
    resetCaptureBuffer();
  }
  resetInterruptSpeechDetection();
  resetInterruptProbeCapture();
  resetBargeInCapture();
  setLevelDb(LEVEL_DB_FLOOR);
  updateControlStates();
}

function setInterruptMode(nextMode) {
  interruptMode = normalizeInterruptMode(nextMode);
  saveInterruptMode();
  if ((voiceInterruptDisabled() || usesKeywordInterruptOnly()) && playbackSoftPaused) {
    resumePlaybackAfterBargeIn();
  }
  resetInterruptSpeechDetection();
  resetInterruptProbeCapture();
  if (!playbackSoftPaused) {
    resetBargeInCapture();
  }
  updateControlStates();
  return interruptMode;
}

function resolveShellState() {
  if (!SHELL_STATUS_ID) {
    return '';
  }
  if (paused || currentState === 'paused') {
    return 'paused';
  }
  if (!ws || ws.readyState !== WebSocket.OPEN || currentState === 'reconnecting') {
    return 'reconnecting';
  }
  if (currentState === 'speaking' || currentAudio || audioQueue.length > 0) {
    return 'speaking';
  }
  if (currentState === 'thinking' || currentState === 'interrupting' || interruptPending || busy) {
    return 'thinking';
  }
  return 'listening';
}

function syncShellState({ force = false } = {}) {
  const state = resolveShellState();
  if (!state || (!force && state === lastPublishedShellState)) {
    return;
  }
  lastPublishedShellState = state;
  fetch(appUrl('api/windows-client/status'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      shell_id: SHELL_STATUS_ID,
      state,
    }),
  }).catch(() => {});
}

function startShellStatusHeartbeat() {
  if (!SHELL_STATUS_ID || shellStatusTimer) {
    return;
  }
  syncShellState({ force: true });
  shellStatusTimer = setInterval(() => {
    syncShellState({ force: true });
  }, 4000);
}

function humanizeRuntimeError(message) {
  const text = (message || '').trim();
  if (!text) return 'runtime error';
  if (text.includes('Command lane') && text.includes('cleared')) {
    return 'session interrupted';
  }
  return text;
}

function audioContextConstructor() {
  return window.AudioContext || window.webkitAudioContext || null;
}

function isAppleVoiceClient() {
  const userAgent = navigator.userAgent || '';
  if (/iPhone|iPad|iPod/.test(userAgent)) {
    return true;
  }
  if (navigator.maxTouchPoints > 1 && userAgent.includes('Macintosh')) {
    return true;
  }
  return userAgent.includes('Macintosh');
}

function allowsFreeformBargeIn() {
  return !usesKeywordInterruptOnly();
}

function isAbortLikeError(error) {
  const text = String(error?.message || error || '').trim().toLowerCase();
  return text.includes('aborterror') || text.includes('operation was aborted') || text.includes('aborted');
}

function describeResumeError(error) {
  const text = String(error?.message || error || '').trim();
  if (!text) {
    return 'resume failed';
  }
  const lower = text.toLowerCase();
  if (lower.includes('permission')) {
    return 'microphone permission blocked';
  }
  if (lower.includes('notallowederror')) {
    return 'microphone permission blocked';
  }
  if (lower.includes('notfounderror')) {
    return 'no microphone available';
  }
  if (lower.includes('secure context')) {
    return 'microphone requires https';
  }
  if (isAbortLikeError(error)) {
    return 'audio startup was interrupted, tap pause again';
  }
  return text;
}

function isCaptureStreamHealthy() {
  if (!stream) {
    return false;
  }
  const tracks = stream.getAudioTracks();
  if (tracks.length === 0) {
    return false;
  }
  return tracks.some((track) => track.readyState === 'live');
}

function clearPlaybackSource() {
  if (!playbackAudio) {
    return;
  }
  playbackAudio.onended = null;
  playbackAudio.onerror = null;
  playbackAudio.pause();
  playbackAudio.currentTime = 0;
  playbackAudio.removeAttribute('src');
  playbackAudio.load();
}

function resetPlaybackElement({ preserveUnlocked = false } = {}) {
  clearPlaybackSource();
  currentAudio = null;
  if (currentAudioUrl) {
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = null;
  }
  if (preserveUnlocked) {
    return;
  }
  playbackAudio = null;
  playbackUnlocked = false;
}

function teardownAudioCapture() {
  if (processor) {
    processor.onaudioprocess = null;
    processor.disconnect();
    processor = null;
  }
  if (analyser) {
    analyser.disconnect();
    analyser = null;
  }
  if (stream) {
    for (const track of stream.getTracks()) {
      track.onended = null;
      track.stop();
    }
    stream = null;
  }
  if (audioCtx) {
    audioCtx.onstatechange = null;
    audioCtx.close().catch(() => {});
    audioCtx = null;
  }
  lastAudioProcessAt = 0;
}

async function ensurePlaybackReady() {
  if (audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
  await unlockPlaybackAudio();
}

async function recoverAudioPipeline(reason) {
  if (audioRecoveryPromise) {
    return audioRecoveryPromise;
  }
  audioRecoveryPromise = (async () => {
    console.warn(`recovering audio pipeline: ${reason}`);
    teardownAudioCapture();
    resetPlaybackElement({ preserveUnlocked: playbackUnlocked });
    await ensureAudio();
    try {
      await ensurePlaybackReady();
    } catch (_) {}
  })().finally(() => {
    audioRecoveryPromise = null;
  });
  return audioRecoveryPromise;
}

function bindAudioRecoveryHooks() {
  if (audioRecoveryHooksBound) {
    return;
  }
  audioRecoveryHooksBound = true;

  navigator.mediaDevices?.addEventListener?.('devicechange', () => {
    if (paused) {
      return;
    }
    void recoverAudioPipeline('devicechange');
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden || paused) {
      return;
    }
    void ensurePlaybackReady().catch(() => {});
  });

  window.addEventListener('focus', () => {
    if (paused) {
      return;
    }
    void ensurePlaybackReady().catch(() => {});
  });

  const handleUserActivation = () => {
    if (paused) {
      return;
    }
    void ensurePlaybackReady().catch(() => {});
  };
  document.addEventListener('pointerdown', handleUserActivation, { passive: true });
  document.addEventListener('keydown', handleUserActivation);
}

function ensureCaptureWatchdog() {
  if (captureWatchdogTimer) {
    return;
  }
  captureWatchdogTimer = setInterval(() => {
    if (paused || muted || document.hidden || !ws || ws.readyState !== WebSocket.OPEN) {
      return;
    }
    if (!audioCtx || !processor || !isCaptureStreamHealthy()) {
      void recoverAudioPipeline('capture-unavailable');
      return;
    }
    if (audioCtx.state === 'suspended') {
      void recoverAudioPipeline('audio-context-suspended');
      return;
    }
    if (lastAudioProcessAt > 0 && performance.now() - lastAudioProcessAt > AUDIO_CAPTURE_STALL_MS) {
      void recoverAudioPipeline('capture-stalled');
    }
  }, AUDIO_WATCHDOG_INTERVAL_MS);
}

function handleResumeFailure(error) {
  console.error(error);
  paused = true;
  busy = false;
  pendingIdle = false;
  interruptPending = false;
  pendingBargeInAudio = null;
  setReplyActive(false);
  stopPlayback();
  resetCaptureBuffer();
  rearmVoiceInterrupt();
  teardownAudioCapture();
  resetPlaybackElement();
  setState('paused');
  setStatusText(describeResumeError(error));
  updateControlStates();
  syncShellState({ force: true });
}

function ensurePlaybackAudioElement() {
  if (playbackAudio) {
    return playbackAudio;
  }
  playbackAudio = new Audio();
  playbackAudio.playsInline = true;
  playbackAudio.preload = 'auto';
  return playbackAudio;
}

async function unlockPlaybackAudio() {
  const audio = ensurePlaybackAudioElement();
  if (playbackUnlocked) {
    return audio;
  }
  audio.muted = true;
  audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  audio.load();
  await audio.play();
  audio.pause();
  audio.currentTime = 0;
  audio.removeAttribute('src');
  audio.load();
  audio.muted = false;
  playbackUnlocked = true;
  return audio;
}

async function loadRuntimeState() {
  if (runtimeStatePromise) {
    return runtimeStatePromise;
  }
  runtimeStatePromise = fetch(appUrl('api/runtime/state'))
    .then((response) => {
      if (!response.ok) {
        throw new Error(`runtime state request failed (${response.status})`);
      }
      return response.json();
    })
    .then((runtimeState) => {
      applyRuntimeAudioSettings(runtimeState.audio);
      applyRuntimeShortcuts(runtimeState.windows_client);
      return runtimeState;
    })
    .catch((error) => {
      runtimeStatePromise = null;
      throw error;
    });
  return runtimeStatePromise;
}

function formatThinkingElapsed(ms) {
  return `${(ms / 1000).toFixed(3)}s`;
}

function updateIndicatorVisibility(state) {
  const level = document.getElementById('level-row');
  const timer = document.getElementById('thinking-timer');
  level.classList.toggle('hidden', state !== 'listening');
  timer.classList.toggle('hidden', state !== 'thinking');
  if (state !== 'thinking') {
    timer.textContent = '';
  }
  if (state !== 'listening') {
    setLevelDb(LEVEL_DB_FLOOR, { updatePeak: false });
    resetLevelPeakHold();
  }
}

function setState(state) {
  currentState = state;
  document.body.dataset.state = state;
  setStatusText(state);
  updateStatusHint();
  if (state === 'thinking') {
    if (thinkingStartedAt === null) {
      thinkingStartedAt = performance.now();
    }
  } else {
    thinkingStartedAt = null;
  }
  updateIndicatorVisibility(state);
  const crab = document.getElementById('crab');
  if (state !== 'speaking') {
    if (speakingTimer) {
      clearInterval(speakingTimer);
      speakingTimer = null;
    }
    crab.src = CRAB_IMAGES[state][0];
    updateControlStates();
    syncShellState();
    return;
  }
  speakingFrame = 0;
  crab.src = CRAB_IMAGES.speaking[speakingFrame];
  if (speakingTimer) clearInterval(speakingTimer);
  speakingTimer = setInterval(() => {
    speakingFrame = speakingFrame === 0 ? 1 : 0;
    crab.src = CRAB_IMAGES.speaking[speakingFrame];
  }, 240);
  updateControlStates();
  syncShellState();
}

function flattenAudio(chunks) {
  const total = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
  const merged = new Int16Array(total);
  let offset = 0;
  for (const chunk of chunks) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }
  return merged.buffer;
}

function maybeReturnToListening() {
  if (paused) {
    pendingIdle = false;
    setReplyActive(false);
    setState('paused');
    return;
  }
  if (isHeldTurnActive()) {
    pendingIdle = false;
    setState('listening');
    return;
  }
  if (pendingIdle && !currentAudio && audioQueue.length === 0) {
    pendingIdle = false;
    rearmVoiceInterrupt();
    resetPlaybackSession();
    setReplyActive(false);
    setState('listening');
  }
}

function resetCaptureBuffer() {
  audioChunks = [];
  silenceStart = null;
  speechStart = null;
  hasSpeech = false;
}

function resetInterruptSpeechDetection() {
  interruptCooldownUntil = 0;
  speechGateHoldUntil = 0;
}

function resetInterruptProbeCapture() {
  interruptProbeChunks = [];
  interruptProbeSpeechMs = 0;
  interruptProbeSilenceMs = 0;
}

function resetBargeInCapture() {
  bargeInChunks = [];
  bargeInSpeechMs = 0;
  bargeInSilenceMs = 0;
  bargeInProbePending = false;
  bargeInPending = false;
}

function resetPlaybackSession() {
  playbackSessionStarted = false;
  bargeInGraceUntil = 0;
}

function startPlaybackSession() {
  if (playbackSessionStarted) {
    return;
  }
  playbackSessionStarted = true;
  bargeInGraceUntil = performance.now() + (
    allowsFreeformBargeIn() ? PLAYBACK_NO_BARGE_IN_MS : APPLE_PLAYBACK_NO_BARGE_IN_MS
  );
}

function rearmVoiceInterrupt() {
  resetInterruptSpeechDetection();
  resetInterruptProbeCapture();
  resetBargeInCapture();
  manualFinishProbeCooldownUntil = 0;
}

function setReplyActive(active) {
  replyActive = active;
}

function isInterruptibleAudioState() {
  return Boolean(
    ws
    && ws.readyState === WebSocket.OPEN
    && !paused
    && !interruptPending
    && (replyActive || currentAudio || audioQueue.length > 0),
  );
}

function isVoiceCommandProbeState() {
  return Boolean(
    ws
    && ws.readyState === WebSocket.OPEN
    && !interruptPending
    && (
      paused
      || (!busy && !replyActive && !currentAudio && audioQueue.length === 0)
    ),
  );
}

function isBargeInState() {
  return Boolean(
    ws
    && ws.readyState === WebSocket.OPEN
    && !paused
    && !voiceInterruptDisabled()
    && !interruptPending
    && !isHeldTurnActive()
    && (replyActive || currentAudio || audioQueue.length > 0),
  );
}

function flattenInt16Chunks(chunks) {
  const total = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
  const merged = new Int16Array(total);
  let offset = 0;
  for (const chunk of chunks) {
    merged.set(chunk, offset);
    offset += chunk.length;
  }
  return merged.buffer;
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    const slice = bytes.subarray(i, i + chunkSize);
    binary += String.fromCharCode(...slice);
  }
  return btoa(binary);
}

async function probeVoiceCommand(audioBuffer, { allowSendPhrase = false, vadOnly = false } = {}) {
  if ((interruptProbePending && !allowSendPhrase) || (manualFinishProbePending && allowSendPhrase) || !ws || ws.readyState !== WebSocket.OPEN) {
    return { action: '', heard: '', content: '', usableSpeech: false };
  }
  if (allowSendPhrase) {
    manualFinishProbePending = true;
  } else {
    interruptProbePending = true;
  }
  try {
    const response = await fetch(appUrl('api/runtime/interrupt-probe'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        audio_b64: arrayBufferToBase64(audioBuffer),
        allow_send_phrase: allowSendPhrase,
        send_phrase: allowSendPhrase ? 'hey go' : '',
        vad_only: vadOnly,
      }),
    });
    if (!response.ok) {
      return { action: '', heard: '', content: '', usableSpeech: false };
    }
    const payload = await response.json();
    return {
      action: String(payload.action || ''),
      heard: String(payload.heard || ''),
      content: String(payload.content || payload.heard || ''),
      usableSpeech: Boolean(payload.usable_speech),
    };
  } catch (_) {
    return { action: '', heard: '', content: '', usableSpeech: false };
  } finally {
    if (allowSendPhrase) {
      manualFinishProbePending = false;
    } else {
      interruptProbePending = false;
    }
  }
}

function maybeProbeManualFinish(now, speechDuration, silenceDuration) {
  if (
    !manualFinishEnabled
    || paused
    || (busy && !isHeldTurnActive())
    || interruptPending
    || !hasSpeech
    || !silenceStart
    || manualFinishProbePending
    || now < manualFinishProbeCooldownUntil
  ) {
    return false;
  }
  const minSpeechDuration = Math.max(settings.min_speech_ms, TURN_COMMIT_MIN_SPEECH_MS);
  if (speechDuration < minSpeechDuration || silenceDuration < MANUAL_FINISH_PROBE_MIN_SILENCE_MS) {
    return false;
  }
  const bufferedAudio = flattenAudio(audioChunks);
  manualFinishProbeCooldownUntil = now + MANUAL_FINISH_PROBE_COOLDOWN_MS;
  void probeVoiceCommand(bufferedAudio, { allowSendPhrase: true }).then((result) => {
    if (
      result.action !== 'send'
      || !ws
      || ws.readyState !== WebSocket.OPEN
      || ((busy && !isHeldTurnActive()))
      || paused
      || interruptPending
    ) {
      return;
    }
    sendBufferedTurn(bufferedAudio, { prefixText: heldTurnPrefixText });
    resetCaptureBuffer();
  });
  return true;
}

function maybeCaptureVoiceCommandProbe(pcm, displayedLevel, speechLike, frameMs, now) {
  if (!isVoiceCommandProbeState()) {
    resetInterruptSpeechDetection();
    resetInterruptProbeCapture();
    return false;
  }
  if (interruptProbePending || now < interruptCooldownUntil) {
    return false;
  }

  const commandThreshold = tuning.inputThresholdDb;
  const minSpeechMs = paused ? PAUSED_COMMAND_MIN_SPEECH_MS : INTERRUPT_PROBE_MIN_SPEECH_MS;
  const maxProbeMs = paused ? PAUSED_COMMAND_MAX_MS : INTERRUPT_PROBE_MAX_MS;
  const aboveThreshold = speechLike && displayedLevel >= commandThreshold;
  const hasCapture = interruptProbeChunks.length > 0;
  if (!hasCapture && !aboveThreshold) {
    return false;
  }

  interruptProbeChunks.push(pcm.slice());
  if (aboveThreshold) {
    interruptProbeSpeechMs += frameMs;
    interruptProbeSilenceMs = 0;
  } else {
    interruptProbeSilenceMs += frameMs;
  }

  const totalMs = interruptProbeSpeechMs + interruptProbeSilenceMs;
  const shouldProbe = (
    interruptProbeSpeechMs >= minSpeechMs
    && (
      interruptProbeSilenceMs >= INTERRUPT_PROBE_SILENCE_MS
      || totalMs >= maxProbeMs
    )
  );

  if (!shouldProbe) {
    return false;
  }

  const probeBuffer = flattenInt16Chunks(interruptProbeChunks);
  resetInterruptProbeCapture();
  interruptCooldownUntil = now + INTERRUPT_COOLDOWN_MS;
  void probeVoiceCommand(probeBuffer).then(async (result) => {
    if (result.action === 'hold' && !paused) {
      armHeldTurn(result.content);
      return;
    }
    if (result.action === 'interrupt' && isInterruptibleAudioState()) {
      requestInterrupt({ keepPaused: false });
      return;
    }
    if (result.action === 'pause') {
      if (paused) {
        await setPausedState(false);
        return;
      }
      await setPausedState(true, { forceInterrupt: true });
    }
  });
  return true;
}

function pausePlaybackForBargeIn() {
  if (playbackSoftPaused) {
    return;
  }
  playbackSoftPaused = true;
  if (currentAudio && !currentAudio.paused) {
    currentAudio.pause();
  }
  if (!paused && !interruptPending) {
    setState('listening');
  }
}

function resumePlaybackAfterBargeIn() {
  if (!playbackSoftPaused) {
    return;
  }
  playbackSoftPaused = false;
  resetBargeInCapture();
  if (paused || interruptPending) {
    return;
  }
  if (currentAudio) {
    currentAudio.play().then(() => {
      if (!paused && !interruptPending) {
        setState('speaking');
      }
    }).catch(() => {
      currentAudio = null;
      playNextAudio();
    });
    return;
  }
  if (audioQueue.length > 0) {
    setState('speaking');
    playNextAudio();
    return;
  }
  maybeReturnToListening();
}

function promoteBargeIn(bufferedAudio) {
  playbackSoftPaused = false;
  pendingBargeInAudio = bufferedAudio;
  pendingBargeInPrefixText = '';
  requestInterrupt({ keepPaused: false });
}

function maybeCaptureBargeInProbe(pcm, displayedLevel, speechLike, frameMs, now) {
  if (!isBargeInState()) {
    if (playbackSoftPaused) {
      playbackSoftPaused = false;
    }
    resetBargeInCapture();
    return false;
  }
  if (now < bargeInGraceUntil) {
    resetBargeInCapture();
    return false;
  }
  if (bargeInProbePending) {
    return true;
  }

  const allowFreeformBargeIn = allowsFreeformBargeIn();
  const bargeThreshold = tuning.inputThresholdDb;
  const requiredBargeInSpeechMs = allowFreeformBargeIn ? BARGE_IN_MIN_SPEECH_MS : APPLE_BARGE_IN_MIN_SPEECH_MS;
  const requiredBargeInSilenceMs = allowFreeformBargeIn ? BARGE_IN_SILENCE_MS : APPLE_BARGE_IN_SILENCE_MS;
  const allowedBargeInMaxMs = allowFreeformBargeIn ? BARGE_IN_MAX_MS : APPLE_BARGE_IN_MAX_MS;
  const aboveThreshold = speechLike && displayedLevel >= bargeThreshold;
  const hasCapture = bargeInChunks.length > 0;
  if (!hasCapture && !aboveThreshold) {
    return false;
  }

  if (!bargeInPending) {
    bargeInPending = true;
    if (allowFreeformBargeIn) {
      pausePlaybackForBargeIn();
    }
  }

  bargeInChunks.push(pcm.slice());
  if (aboveThreshold) {
    bargeInSpeechMs += frameMs;
    bargeInSilenceMs = 0;
  } else {
    bargeInSilenceMs += frameMs;
  }

  const totalMs = bargeInSpeechMs + bargeInSilenceMs;
  const shouldProbe = (
    bargeInSpeechMs >= requiredBargeInSpeechMs
    && (
      bargeInSilenceMs >= requiredBargeInSilenceMs
      || totalMs >= allowedBargeInMaxMs
    )
  );
  if (!shouldProbe) {
    return true;
  }

  const probeBuffer = flattenInt16Chunks(bargeInChunks);
  bargeInProbePending = true;
  void probeVoiceCommand(probeBuffer, { vadOnly: allowFreeformBargeIn }).then(async (result) => {
    bargeInProbePending = false;
    if (result.action === 'pause') {
      resetBargeInCapture();
      await setPausedState(true, { forceInterrupt: true });
      return;
    }
    if (result.action === 'interrupt') {
      requestInterrupt({ keepPaused: false });
      resetBargeInCapture();
      return;
    }
    if (allowFreeformBargeIn && (result.action === 'send' || result.usableSpeech)) {
      promoteBargeIn(probeBuffer);
      resetBargeInCapture();
      return;
    }
    if (playbackSoftPaused) {
      resumePlaybackAfterBargeIn();
      return;
    }
    resetBargeInCapture();
  }).catch(() => {
    bargeInProbePending = false;
    if (playbackSoftPaused) {
      resumePlaybackAfterBargeIn();
      return;
    }
    resetBargeInCapture();
  });
  return true;
}

function stopPlayback() {
  playbackSoftPaused = false;
  resetPlaybackSession();
  audioQueue = [];
  if (!currentAudio) {
    clearPlaybackSource();
    setReplyActive(false);
    updateControlStates();
    return;
  }
  clearPlaybackSource();
  if (currentAudioUrl) {
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = null;
  }
  currentAudio = null;
  setReplyActive(false);
  updateControlStates();
}

function requestInterrupt({ keepPaused = paused, preservePendingInput = false } = {}) {
  resetCaptureBuffer();
  resetInterruptSpeechDetection();
  resetBargeInCapture();
  if (!preservePendingInput) {
    pendingBargeInAudio = null;
    pendingBargeInPrefixText = '';
    clearHeldTurnState();
  }
  pendingIdle = false;
  interruptPending = true;
  setReplyActive(false);
  stopPlayback();
  if (keepPaused) {
    setState('paused');
  } else {
    setState('interrupting');
  }
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    interruptPending = false;
    busy = false;
    if (!preservePendingInput) {
      pendingBargeInAudio = null;
      pendingBargeInPrefixText = '';
    }
    setState(keepPaused ? 'paused' : 'listening');
    return;
  }
  ws.send(JSON.stringify({ type: 'interrupt' }));
  updateControlStates();
}

function manualInterrupt() {
  if (paused) {
    return;
  }
  requestInterrupt({ keepPaused: false });
}

async function setPausedState(nextPaused, { forceInterrupt = false } = {}) {
  paused = Boolean(nextPaused);
  if (paused) {
    pendingBargeInAudio = null;
    pendingBargeInPrefixText = '';
    clearHeldTurnState();
    setReplyActive(false);
    requestInterrupt({ keepPaused: true });
    return;
  }
  try {
    if (!audioCtx || !ws || ws.readyState === WebSocket.CLOSING || ws.readyState === WebSocket.CLOSED) {
      await initWithRetry();
      return;
    }
    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }
    await unlockPlaybackAudio();
  } catch (error) {
    handleResumeFailure(error);
    return;
  }
  interruptPending = false;
  busy = false;
  pendingIdle = false;
  pendingBargeInAudio = null;
  pendingBargeInPrefixText = '';
  if (forceInterrupt) {
    stopPlayback();
  }
  setReplyActive(false);
  resetCaptureBuffer();
  resetInterruptSpeechDetection();
  resetInterruptProbeCapture();
  clearHeldTurnState();
  setState('listening');
  updateControlStates();
}

function playNextAudio() {
  if (playbackSoftPaused || currentAudio || audioQueue.length === 0) {
    maybeReturnToListening();
    return;
  }
  const nextItem = audioQueue.shift();
  const nextBuffer = nextItem && typeof nextItem === 'object' && 'buffer' in nextItem
    ? nextItem.buffer
    : nextItem;
  const mimeType = nextItem && typeof nextItem === 'object' && 'mimeType' in nextItem
    ? nextItem.mimeType
    : 'audio/mpeg';
  const blob = new Blob([nextBuffer], { type: mimeType });
  currentAudioUrl = URL.createObjectURL(blob);
  const playbackUrl = currentAudioUrl;
  currentAudio = ensurePlaybackAudioElement();
  currentAudio.src = playbackUrl;
  currentAudio.playsInline = true;
  currentAudio.preload = 'auto';
  currentAudio.onended = () => {
    URL.revokeObjectURL(playbackUrl);
    if (currentAudioUrl === playbackUrl) {
      currentAudioUrl = null;
    }
    clearPlaybackSource();
    currentAudio = null;
    updateControlStates();
    playNextAudio();
  };
  currentAudio.onerror = () => {
    URL.revokeObjectURL(playbackUrl);
    if (currentAudioUrl === playbackUrl) {
      currentAudioUrl = null;
    }
    resetPlaybackElement();
    setStatusText('audio playback failed');
    updateControlStates();
    playNextAudio();
  };
  startPlaybackSession();
  currentAudio.play().catch((error) => {
    console.error(error);
    URL.revokeObjectURL(playbackUrl);
    if (currentAudioUrl === playbackUrl) {
      currentAudioUrl = null;
    }
    resetPlaybackElement();
    setStatusText('tap resume to enable audio');
    updateControlStates();
    playNextAudio();
  });
  updateControlStates();
}

async function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
    return;
  }
  const wsUrl = new URL('ws/voice', APP_BASE);
  wsUrl.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    setReplyActive(false);
    rearmVoiceInterrupt();
    setState(paused ? 'paused' : 'listening');
    updateControlStates();
    void ensurePlaybackReady().catch(() => {});
    syncShellState({ force: true });
  };
  ws.onclose = () => {
    busy = false;
    pendingIdle = false;
    interruptPending = false;
    pendingBargeInAudio = null;
    pendingBargeInPrefixText = '';
    clearHeldTurnState();
    setReplyActive(false);
    stopPlayback();
    setState('reconnecting');
    updateControlStates();
    syncShellState({ force: true });
    setTimeout(connect, 1500);
  };
  ws.onmessage = async (event) => {
    if (event.data instanceof ArrayBuffer) {
      const serverSpeakRequestId = pendingServerSpeakRequestId;
      pendingServerSpeakRequestId = '';
      if (paused || interruptPending) {
        if (serverSpeakRequestId) {
          sendPlaybackRejection(serverSpeakRequestId, paused ? 'The voice client is paused.' : 'Playback was interrupted before it could start.');
        }
        return;
      }
      try {
        await ensurePlaybackReady();
      } catch (error) {
        if (serverSpeakRequestId) {
          sendPlaybackRejection(serverSpeakRequestId, error?.message || error);
        }
        return;
      }
      setReplyActive(true);
      audioQueue.push({
        buffer: event.data,
        mimeType: pendingAudioMimeType || 'audio/mpeg',
      });
      if (serverSpeakRequestId) {
        sendPlaybackAcceptance(serverSpeakRequestId);
      }
      if (!playbackSoftPaused) {
        setState('speaking');
      }
      playNextAudio();
      return;
    }
    const data = JSON.parse(event.data);
    if (data.error) {
      busy = false;
      pendingIdle = false;
      interruptPending = false;
      pendingBargeInAudio = null;
      pendingBargeInPrefixText = '';
      clearHeldTurnState();
      setReplyActive(false);
      if (paused) {
        setState('paused');
      } else {
        setState('listening');
        setStatusText(humanizeRuntimeError(data.error));
        scheduleListeningStatusRestore();
      }
      updateControlStates();
      syncShellState();
      return;
    }
    if (data.type === 'voice-command') {
      if (data.action === 'hold' && !paused) {
        armHeldTurn(String(data.content || data.heard || ''));
      } else if (data.action === 'pause') {
        await setPausedState(!paused, { forceInterrupt: true });
      } else if (data.action === 'interrupt' && !paused) {
        requestInterrupt({ keepPaused: false });
      }
      updateControlStates();
      syncShellState();
      return;
    }
    if (data.source === 'server_speak') {
      if (data.status === 'speaking') {
        pendingServerSpeakRequestId = String(data.request_id || '');
        pendingAudioMimeType = String(data.audio_mime_type || pendingAudioMimeType || 'audio/mpeg');
      } else if (data.status === 'idle') {
        pendingServerSpeakRequestId = '';
      }
    }
    if (data.status === 'thinking') {
      setReplyActive(true);
      rearmVoiceInterrupt();
      busy = true;
      pendingIdle = false;
      if (!paused && !interruptPending && !isHeldTurnActive()) {
        setState('thinking');
      }
    } else if (data.status === 'speaking') {
      pendingAudioMimeType = String(data.audio_mime_type || pendingAudioMimeType || 'audio/mpeg');
      setReplyActive(true);
      rearmVoiceInterrupt();
      busy = true;
      pendingIdle = false;
      if (!paused && !interruptPending && !isHeldTurnActive()) {
        setState('speaking');
      }
    } else if (data.status === 'idle') {
      setReplyActive(Boolean(currentAudio || audioQueue.length > 0));
      rearmVoiceInterrupt();
      busy = false;
      interruptPending = false;
      if (pendingBargeInAudio && !paused && ws && ws.readyState === WebSocket.OPEN) {
        const bufferedAudio = pendingBargeInAudio;
        const prefixText = pendingBargeInPrefixText;
        pendingBargeInAudio = null;
        pendingBargeInPrefixText = '';
        if (prefixText) {
          sendTranscriptPrefix(prefixText);
        }
        busy = true;
        pendingIdle = false;
        setState('thinking');
        ws.send(bufferedAudio);
      } else {
        pendingIdle = !paused && !isHeldTurnActive();
        maybeReturnToListening();
      }
    }
    updateControlStates();
    syncShellState();
  };
}

async function ensureAudio() {
  bindAudioRecoveryHooks();
  ensureCaptureWatchdog();
  if (audioCtx && processor && isCaptureStreamHealthy()) {
    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }
    return;
  }
  const getUserMedia = navigator.mediaDevices?.getUserMedia?.bind(navigator.mediaDevices);
  if (!getUserMedia) {
    throw new Error('This browser does not support microphone capture.');
  }
  const AudioContextClass = audioContextConstructor();
  if (!AudioContextClass) {
    throw new Error('This browser does not support Web Audio.');
  }
  stream = await getUserMedia({
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
      channelCount: 1,
    },
  });
  try {
    audioCtx = new AudioContextClass({ sampleRate: TARGET_CAPTURE_SAMPLE_RATE });
  } catch (_) {
    audioCtx = new AudioContextClass();
  }
  if (audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
  const source = audioCtx.createMediaStreamSource(stream);
  applyMicMuteState();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  const processorSink = audioCtx.createGain();
  processorSink.gain.value = 0;
  source.connect(analyser);
  analyser.connect(processor);
  processor.connect(processorSink);
  processorSink.connect(audioCtx.destination);
  audioCtx.onstatechange = () => {
    if (!paused && audioCtx && audioCtx.state === 'suspended') {
      void recoverAudioPipeline('audio-context-statechange');
    }
  };
  for (const track of stream.getAudioTracks()) {
    track.onended = () => {
      if (!paused) {
        void recoverAudioPipeline('mic-track-ended');
      }
    };
  }
  lastAudioProcessAt = performance.now();
  processor.onaudioprocess = onAudioProcess;
}

function onAudioProcess(event) {
  lastAudioProcessAt = performance.now();
  if (
    !ws ||
    ws.readyState !== WebSocket.OPEN ||
    interruptPending
  ) {
    resetInterruptSpeechDetection();
    resetInterruptProbeCapture();
    return;
  }
  if (muted) {
    resetCaptureBuffer();
    resetInterruptSpeechDetection();
    resetInterruptProbeCapture();
    resetBargeInCapture();
    if (currentLevelDb !== LEVEL_DB_FLOOR) {
      setLevelDb(LEVEL_DB_FLOOR);
    }
    return;
  }
  const input = event.inputBuffer.getChannelData(0);
  const inputSampleRate = Math.max(Number(audioCtx?.sampleRate) || TARGET_CAPTURE_SAMPLE_RATE, 1);
  const pcm = inputBufferToPcm16(input, inputSampleRate);
  let peakLevel = 0;
  let sumSquares = 0;
  let zeroCrossings = 0;
  let previousSample = input[0] || 0;
  for (let i = 0; i < input.length; i += 1) {
    const sample = Math.max(-1, Math.min(1, input[i]));
    const magnitude = Math.abs(sample);
    peakLevel = Math.max(peakLevel, magnitude);
    sumSquares += sample * sample;
    if ((sample >= 0 && previousSample < 0) || (sample < 0 && previousSample >= 0)) {
      zeroCrossings += 1;
    }
    previousSample = sample;
  }
  const rmsLevel = Math.sqrt(sumSquares / input.length);
  const zeroCrossingRate = zeroCrossings / input.length;
  const crestFactor = peakLevel / Math.max(rmsLevel, 0.0001);
  const speechLikeCurrent = Boolean(
    rmsLevel >= 0.006
    && zeroCrossingRate >= SPEECH_ZCR_MIN
    && zeroCrossingRate <= SPEECH_ZCR_MAX
    && crestFactor <= SPEECH_CREST_MAX
  );
  const now = performance.now();
  if (speechLikeCurrent) {
    speechGateHoldUntil = now + SPEECH_GATE_HOLD_MS;
  }
  const speechLike = speechLikeCurrent || now < speechGateHoldUntil;
  const interruptSpeechLike = Boolean(
    speechLike
    || (
      rmsLevel >= INTERRUPT_RMS_MIN
      && zeroCrossingRate >= INTERRUPT_ZCR_MIN
      && zeroCrossingRate <= INTERRUPT_ZCR_MAX
      && crestFactor <= INTERRUPT_CREST_MAX
    )
  );
  const baseLevel = clampNumber(
    amplitudeToDb(rmsLevel),
    LEVEL_DB_FLOOR,
    LEVEL_DB_CEILING,
    LEVEL_DB_FLOOR,
  );
  const displayedLevel = Math.max(baseLevel, currentLevelDb - (speechLike ? 1.2 : 2.8));
  setLevelDb(displayedLevel);
  const frameMs = (pcm.length / TARGET_CAPTURE_SAMPLE_RATE) * 1000;
  if (maybeCaptureBargeInProbe(pcm, displayedLevel, interruptSpeechLike, frameMs, now)) {
    return;
  }
  if (maybeCaptureVoiceCommandProbe(pcm, displayedLevel, interruptSpeechLike, frameMs, now)) {
    return;
  }
  if (paused) {
    resetCaptureBuffer();
    return;
  }
  if (!isHeldTurnActive() && (busy || currentAudio || audioQueue.length > 0 || currentState === 'speaking')) {
    return;
  }
  const turnActiveThreshold = speechLike
    ? tuning.inputThresholdDb + gainMultiplierToDb(0.72)
    : tuning.inputThresholdDb;
  if (displayedLevel > turnActiveThreshold) {
    if (!speechStart) speechStart = now;
    silenceStart = null;
    hasSpeech = true;
    audioChunks.push(pcm);
    return;
  }
  if (!hasSpeech) return;
  audioChunks.push(pcm);
  if (!silenceStart) silenceStart = now;
  const speechDuration = speechStart ? now - speechStart : 0;
  const silenceDuration = now - silenceStart;
  if (maybeProbeManualFinish(now, speechDuration, silenceDuration)) {
    return;
  }
  const minSpeechDuration = Math.max(settings.min_speech_ms, TURN_COMMIT_MIN_SPEECH_MS);
  const turnEndSilenceMs = resolveWaitAfterSpeakMs();
  if (speechDuration >= minSpeechDuration && silenceDuration >= turnEndSilenceMs) {
    sendBufferedTurn(flattenAudio(audioChunks), { prefixText: heldTurnPrefixText });
    resetCaptureBuffer();
  }
}

async function init() {
  if (isAppleVoiceClient()) {
    await unlockPlaybackAudio();
    await ensureAudio();
  } else {
    await ensureAudio();
    await unlockPlaybackAudio();
  }
  await loadRuntimeState();
  await connect();
  setState(paused ? 'paused' : 'listening');
}

async function initWithRetry() {
  try {
    await init();
  } catch (error) {
    if (!isAppleVoiceClient() || !isAbortLikeError(error)) {
      throw error;
    }
    teardownAudioCapture();
    // Keep the original user-activated media element alive for the Safari retry.
    resetPlaybackElement({ preserveUnlocked: playbackUnlocked });
    await new Promise((resolve) => setTimeout(resolve, 150));
    await init();
  }
}

function animateLevelDecay() {
  if (currentState === 'thinking' && thinkingStartedAt !== null) {
    document.getElementById('thinking-timer').textContent = formatThinkingElapsed(
      performance.now() - thinkingStartedAt,
    );
  }
  if (busy || currentState !== 'listening') {
    if (currentLevelDb !== LEVEL_DB_FLOOR) {
      setLevelDb(LEVEL_DB_FLOOR);
    }
  } else if (currentLevelDb > LEVEL_DB_FLOOR + 0.1) {
    setLevelDb(currentLevelDb - 2.2);
  } else if (currentLevelDb !== LEVEL_DB_FLOOR) {
    setLevelDb(LEVEL_DB_FLOOR);
  }
  requestAnimationFrame(animateLevelDecay);
}

document.getElementById('crab').addEventListener('click', () => {
  document.getElementById('pause-btn').click();
});

document.getElementById('pause-btn').addEventListener('click', async () => {
  await setPausedState(!paused);
});

document.getElementById('mute-btn').addEventListener('click', () => {
  setMutedState(!muted);
});

setState('paused');
configureSetupLink();
configureTuningControls();
updateControlStates();
window.__openclawManualInterrupt = manualInterrupt;
window.__openclawToggleVoiceInterrupt = () => setInterruptMode(
  interruptMode === 'off' ? 'barge-in' : (interruptMode === 'barge-in' ? 'keyword' : 'off')
);
startShellStatusHeartbeat();
animateLevelDecay();
</script>
